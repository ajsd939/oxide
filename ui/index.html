<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Rust IDE</title>
  <link rel="stylesheet" href="xterm/xterm.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body data-theme="dark">
  <div id="app">
    <!-- Activity bar -->
    <nav id="activity-bar">
      <button class="activity-btn active" id="act-explorer" title="Explorer">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <path d="M1.5 3.5h4.5l1.5 2h7v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-9.5a1 1 0 0 1 1-1z"/>
        </svg>
      </button>
      <button class="activity-btn" id="act-build" title="Build and Run (Ctrl+Shift+B)">
        <svg viewBox="0 0 16 16" fill="currentColor">
          <path d="M4 2.5v11l9-5.5z"/>
        </svg>
      </button>
      <button class="activity-btn" id="act-git" title="Source Control (Ctrl+Shift+G)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <circle cx="5" cy="3.5" r="1.8"/><circle cx="5" cy="12.5" r="1.8"/><circle cx="11" cy="6" r="1.8"/>
          <path d="M5 5.3v5.4M11 7.8c0 3-3 3.5-4.5 3.5"/>
        </svg>
      </button>
      <div class="activity-spacer"></div>
      <button class="activity-btn" id="act-theme" title="Cycle theme (Ctrl+K)">
        <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
          <circle cx="8" cy="8" r="5.5"/>
          <path d="M8 2.5v11a5.5 5.5 0 0 0 0-11z" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </nav>

    <!-- Sidebar / Explorer -->
    <aside id="sidebar">
      <div id="explorer-view">
        <div class="side-header">
          <span class="side-title">EXPLORER</span>
          <div class="side-tools">
            <button class="tool-btn" id="btn-new-file" title="New File">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M4 1.5h5l3 3v10h-8z"/><path d="M9 1.5v3h3"/><path d="M8 7v4M6 9h4"/>
              </svg>
            </button>
            <button class="tool-btn" id="btn-new-folder" title="New Folder">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M1.5 3.5h4.5l1.5 2h7v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-9.5a1 1 0 0 1 1-1z"/>
                <path d="M8 8v3M6.5 9.5h3"/>
              </svg>
            </button>
            <button class="tool-btn" id="btn-refresh" title="Refresh explorer">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.7 1.8v2.7h-2.7"/>
              </svg>
            </button>
            <button class="tool-btn" id="btn-open-folder" title="Open Folder (Ctrl+O)">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M1.5 3.5h4.5l1.5 2h7v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-9.5a1 1 0 0 1 1-1z"/>
                <path d="M6 9.5h8l-1.5 4h-8z"/>
              </svg>
            </button>
          </div>
        </div>
        <button class="project-pill" id="project-name" title="Open another folder">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <path d="M1.5 3.5h4.5l1.5 2h7v7.5a1 1 0 0 1-1 1h-11a1 1 0 0 1-1-1v-9.5a1 1 0 0 1 1-1z"/>
          </svg>
          <span id="project-label">no folder</span>
          <svg class="chev" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 6l4 4 4-4"/></svg>
        </button>
        <div id="file-tree" class="thin-scroll"></div>
      </div>

      <div id="git-view" class="hidden">
        <div class="side-header">
          <span class="side-title">SOURCE CONTROL</span>
          <div class="side-tools">
            <button class="tool-btn" id="btn-git-refresh" title="Refresh">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.7 1.8v2.7h-2.7"/>
              </svg>
            </button>
          </div>
        </div>
        <div id="git-branch" class="branch-pill">
          <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
            <circle cx="5" cy="3.5" r="1.8"/><circle cx="5" cy="12.5" r="1.8"/><circle cx="11" cy="6" r="1.8"/>
            <path d="M5 5.3v5.4M11 7.8c0 3-3 3.5-4.5 3.5"/>
          </svg>
          <span id="git-branch-name">—</span>
          <span id="git-ahead-behind"></span>
        </div>
        <div id="git-notice" class="hidden"></div>
        <div class="git-toolbar">
          <button class="btn small" id="btn-git-stage-all">Stage all</button>
          <button class="btn small" id="btn-git-pull">Pull</button>
          <button class="btn small" id="btn-git-push">Push</button>
        </div>
        <div id="git-lists" class="thin-scroll">
          <div class="git-section" id="sec-staged">
            <div class="git-sec-title">STAGED <span id="count-staged" class="muted"></span></div>
            <div id="git-staged"></div>
          </div>
          <div class="git-section" id="sec-changes">
            <div class="git-sec-title">CHANGES <span id="count-changes" class="muted"></span></div>
            <div id="git-changes"></div>
          </div>
        </div>
        <div id="commit-box">
          <textarea id="commit-msg" placeholder="Commit message… (Ctrl+Enter)" rows="2" spellcheck="false"></textarea>
          <button class="btn primary" id="btn-commit">✓ Commit</button>
        </div>
      </div>
    </aside>

    <!-- Main column -->
    <main id="main">
      <div id="tab-bar"></div>

      <div id="editor-host">
        <div id="welcome">
          <div class="welcome-logo">&gt;_</div>
          <h1>Rust IDE</h1>
          <p class="muted">Open a file from the explorer, or</p>
          <div class="welcome-actions">
            <button class="btn primary" id="welcome-open">Open Folder…</button>
            <button class="btn" id="welcome-quick">Quick Open <kbd>Ctrl+P</kbd></button>
          </div>
          <p class="muted small">rust-analyzer intellisense · cargo build &amp; run · themes</p>
        </div>
        <div id="monaco-host"></div>
      </div>

      <!-- Draggable divider between editor and the bottom dock -->
      <div id="panel-resizer" title="Drag to resize"></div>

      <!-- Bottom dock: OUTPUT / TERMINAL -->
      <section id="panel">
        <div class="panel-header">
          <div class="panel-tabs">
            <button class="panel-tab active" id="ptab-output">OUTPUT</button>
            <button class="panel-tab" id="ptab-terminal">TERMINAL</button>
          </div>
          <span id="panel-chip" class="chip">idle</span>
          <div class="panel-tools">
            <button class="tool-btn" id="btn-build" title="Build (Ctrl+Shift+B)">
              <svg viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg>
            </button>
            <button class="tool-btn" id="btn-run" title="Run (Ctrl+Shift+R)">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M4 2.5v11l9-5.5z"/><path d="M2 14h12"/>
              </svg>
            </button>
            <button class="tool-btn hidden" id="btn-term-restart" title="Restart terminal">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M13.5 8a5.5 5.5 0 1 1-1.6-3.9"/><path d="M13.7 1.8v2.7h-2.7"/>
              </svg>
            </button>
            <button class="tool-btn" id="btn-clear-output" title="Clear output">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3">
                <path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.7 8.5a1 1 0 0 0 1 .9h3.6a1 1 0 0 0 1-.9l.7-8.5"/>
              </svg>
            </button>
            <button class="tool-btn" id="btn-panel-close" title="Hide panel (Ctrl+`)">
              <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.3"><path d="M4 4l8 8M12 4l-8 8"/></svg>
            </button>
          </div>
        </div>
        <div id="panel-lines" class="thin-scroll"></div>
        <div id="terminal-host" class="hidden"></div>
      </section>
    </main>

    <!-- Status bar -->
    <footer id="status-bar">
      <div class="status-left">
        <button class="status-item" id="status-diag" title="Diagnostics">
          <span id="diag-errors" class="diag-err">✖ 0</span>
          <span id="diag-warnings" class="diag-warn">⚠ 0</span>
        </button>
        <span class="status-item" id="status-build">ready to build</span>
      </div>
      <div class="status-right">
        <button class="status-item btn-like" id="status-build-btn">▶ Build</button>
        <span class="status-item" id="status-lang">—</span>
        <span class="status-item" id="status-pos">Ln 1, Col 1</span>
        <span class="status-item" id="status-lsp">rust-analyzer: off</span>
        <span class="status-item" id="status-cargo">cargo …</span>
        <span class="status-item" id="status-theme">One Dark</span>
      </div>
    </footer>
  </div>

  <!-- Quick open -->
  <div id="quick-open" class="overlay hidden">
    <div class="quick-box">
      <input id="quick-input" type="text" placeholder="Go to file… (type to filter, Enter to open, Esc to dismiss)" spellcheck="false" />
      <div id="quick-list" class="thin-scroll"></div>
    </div>
  </div>

  <!-- Tree context menu -->
  <div id="context-menu" class="hidden"></div>

  <!-- xterm BEFORE monaco's loader: monaco defines window.define (AMD) which
       would otherwise swallow xterm's UMD global registration -->
  <script src="xterm/xterm.js"></script>
  <script src="xterm/addon-fit.js"></script>
  <script src="monaco/vs/loader.js"></script>
  <script src="app.js"></script>
</body>
</html>
