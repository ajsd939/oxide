[package]
name = "oxide"
version = "0.3.0"
edition = "2021"
description = "A VS Code-like IDE in Rust (Tauri + Monaco) with rust-analyzer intellisense, integrated terminal, and git"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
portable-pty = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
lsp-types = { version = "0.97", features = ["proposed"] }
anyhow = "1"

[profile.dev]
# tauri/tao/wry are slow unoptimized; keep dev builds usable
opt-level = 1
debug = "line-tables-only"
