name: build

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  windows-nsis:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Fetch frontend assets (monaco, xterm)
        run: powershell -ExecutionPolicy Bypass -File scripts/fetch-assets.ps1
      - name: Install tauri-cli
        run: cargo install tauri-cli --version "^2" --locked
      - name: Build NSIS installer
        run: cargo tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: rustide-windows-nsis
          path: target/release/bundle/nsis/*.exe

  linux-targz:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install system deps (webkit2gtk)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev libxdo-dev libssl-dev patchelf build-essential curl file
      - name: Fetch frontend assets (monaco, xterm)
        run: bash scripts/fetch-assets.sh
      - name: Build release binary
        run: cargo build --release
      - name: Package tar.gz
        run: |
          mkdir -p rustide-linux
          cp target/release/rustide rustide-linux/
          cp README.md LICENSE* rustide-linux/ 2>/dev/null || cp README.md rustide-linux/
          tar -czf rustide-linux-x64.tar.gz rustide-linux
      - uses: actions/upload-artifact@v4
        with:
          name: rustide-linux-targz
          path: rustide-linux-x64.tar.gz
